
<p><a href="index.html" style="color:#c62828;font-weight:bold;">← Back to MA-KAVOI Website</a></p><!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MA-KAVOI Admin Dashboard</title>
<style>
body{font-family:Arial;background:#f2f5fa;margin:0;padding:20px;color:#172033}
header{background:#102b55;color:white;padding:20px;border-radius:10px}
input,textarea,select{width:100%;padding:12px;margin:8px 0 15px;box-sizing:border-box;border:1px solid #ccc;border-radius:6px}
textarea{height:180px}
button{background:#c62828;color:white;padding:14px;border:0;border-radius:6px;width:100%;font-size:16px}
small{color:#555}
</style>
</head>
<body>
<header>
<h2>MA-KAVOI PODCAST</h2>
<p>Admin Dashboard – Article Publisher</p>
</header>

<h3>Create a News Article</h3>

<label>Article title</label>
<input id="title" placeholder="Enter article title">

<label>Category</label>
<select id="category">
<option>News</option>
<option>Culture</option>
<option>Podcast</option>
<option>Community</option>
</select>

<label>Article content</label>
<textarea id="content" placeholder="Write your article here..."></textarea>

<button onclick="downloadArticle()">Prepare Article File</button>

<p id="message"></p>
<small>This dashboard prepares an article JSON file for uploading to the GitHub articles folder. It does not publish directly from this page.</small>

<script>
function downloadArticle(){
const title=document.getElementById("title").value.trim();
const content=document.getElementById("content").value.trim();
const category=document.getElementById("category").value;

if(!title || !content){
document.getElementById("message").textContent="Please enter a title and article content.";
return;
}

const article={
title:title,
date:new Date().toISOString().slice(0,10),
category:category,
content:content
};

const file=new Blob([JSON.stringify(article,null,2)],{type:"application/json"});
const url=URL.createObjectURL(file);
const link=document.createElement("a");
link.href=url;
link.download="article-"+Date.now()+".json";
link.click();
URL.revokeObjectURL(url);

document.getElementById("message").textContent="Article file prepared. Upload it to the GitHub articles folder to publish.";
}
</script>
</body>
</html>
