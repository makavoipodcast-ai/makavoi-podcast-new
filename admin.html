
  
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MA-KAVOI Admin Dashboard</title>

<style>
body{
font-family:Arial;
background:#f2f5fa;
margin:0;
padding:20px;
color:#172033;
}
header{
background:#102b55;
color:white;
padding:20px;
border-radius:10px;
}
section{
background:white;
padding:20px;
margin-top:20px;
border-radius:10px;
}
input,textarea,select{
width:100%;
padding:12px;
margin:8px 0 15px;
box-sizing:border-box;
border:1px solid #ccc;
border-radius:6px;
}
textarea{height:150px}
button{
background:#c62828;
color:white;
padding:14px;
border:0;
border-radius:6px;
width:100%;
font-size:16px;
}
small{color:#555}
</style>
</head>

<body>

<header>
<h2>MA-KAVOI PODCAST</h2>
<p>Admin Dashboard</p>
<p>OUR CULTURE. OUR STORIES.</p>
</header>

<p><a href="index.html">← Back to MA-KAVOI Website</a></p>

<section>
<h3>Create a News Article</h3>

<label>Article title</label>
<input id="title" placeholder="Enter article title">

<label>Category</label>
<select id="category">
<option>News</option>
<option>Culture</option>
<option>Podcast</option>
<option>Community</option>
</select>

<label>Article content</label>
<textarea id="content" placeholder="Write your article here"></textarea>

<button onclick="downloadArticle()">Prepare Article File</button>
<p id="message"></p>
<small>Upload the prepared JSON file to GitHub articles folder to publish.</small>
</section>

<section>
<h3>Upload Podcast Episode</h3>

<label>Episode title</label>
<input id="episodeTitle" placeholder="Enter episode title">

<label>Podcast description</label>
<textarea id="episodeDescription" placeholder="Describe this episode"></textarea>

<label>Podcast audio link</label>
<input id="audioLink" placeholder="Paste audio link">

<button onclick="preparePodcast()">Prepare Podcast Episode</button>
<p id="podcastMessage"></p>
<small>Upload the prepared JSON file to GitHub to publish.</small>
</section>

<script>
function downloadJSON(data, filename){
const file = new Blob(
[JSON.stringify(data,null,2)],
{type:"application/json"}
);
const url = URL.createObjectURL(file);
const link = document.createElement("a");
link.href = url;
link.download = filename;
link.click();
URL.revokeObjectURL(url);
}

function downloadArticle(){
const title = document.getElementById("title").value.trim();
const content = document.getElementById("content").value.trim();
const category = document.getElementById("category").value;

if(!title || !content){
document.getElementById("message").textContent =
"Please enter title and content.";
return;
}

downloadJSON({
title:title,
date:new Date().toISOString().slice(0,10),
category:category,
content:content
},"article-"+Date.now()+".json");

document.getElementById("message").textContent =
"Article file prepared.";
}

function preparePodcast(){
const title = document.getElementById("episodeTitle").value.trim();
const description = document.getElementById("episodeDescription").value.trim();
const audio = document.getElementById("audioLink").value.trim();

if(!title || !audio){
document.getElementById("podcastMessage").textContent =
"Enter episode title and audio link.";
return;
}

downloadJSON({
title:title,
description:description,
audio:audio,
date:new Date().toISOString().slice(0,10)
},"podcast-episode.json");

document.getElementById("podcastMessage").textContent =
"Podcast episode file prepared.";
}
</script>

</body>
</html>
