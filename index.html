<section id="admin" style="padding:25px;background:#111;color:white;">
<h2>MA-KAVOI PODCAST ADMIN DASHBOARD</h2>
<p>Manage your podcast content.</p>

<h3>Publish News</h3>
<input id="newsTitle" placeholder="News headline">
<br><br>
<textarea id="newsContent" placeholder="Write your news here"></textarea>
<br><br>
<button onclick="publishNews()">Publish News</button>

<div id="publishedNews"></div>
</section>

<script>
function publishNews(){
let title=document.getElementById("newsTitle").value;
let content=document.getElementById("newsContent").value;

if(!title || !content){
alert("Please fill in all fields");
return;
}

let article=document.createElement("div");
article.innerHTML="<h3>"+title+"</h3><p>"+content+"</p>";
document.getElementById("publishedNews").prepend(article);

document.getElementById("newsTitle").value="";
document.getElementById("newsContent").value="";
}
</script>
