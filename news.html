<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MA-KAVOI PODCAST | News</title>
<style>
body{margin:0;font-family:Arial;background:#f4f6fa;color:#172033}
header{background:#102b55;color:white;padding:25px;text-align:center}
nav{background:#c62828;padding:12px;text-align:center}
nav a{color:white;margin:10px;text-decoration:none;font-weight:bold}
main{max-width:850px;margin:25px auto;padding:15px}
article{background:white;padding:20px;margin-bottom:18px;border-radius:9px}
h2{color:#102b55}
footer{background:#102b55;color:white;text-align:center;padding:20px}
</style>
</head>
<body>
<header>
<h1>MA-KAVOI PODCAST</h1>
<p>OUR CULTURE. OUR STORIES.</p>
</header>
<nav>
<a href="index.html">Home</a>
<a href="news.html">News</a>
<a href="admin.html">Admin</a>
</nav>
<main>
<h2>Latest News & Stories</h2>
<div id="articles">Loading articles...</div>
</main>
<footer>
<p>© 2026 MA-KAVOI PODCAST</p>
</footer>
<script>
async function loadArticles(){
const box=document.getElementById("articles");
try{
const response=await fetch("articles/welcome.json");
if(!response.ok) throw new Error("No articles found");
const article=await response.json();
box.innerHTML="";
const item=document.createElement("article");
const title=document.createElement("h2");
title.textContent=article.title;
const date=document.createElement("small");
date.textContent=article.date+" | "+article.category;
const content=document.createElement("p");
content.textContent=article.content;
item.append(title,date,content);
box.appendChild(item);
}catch(error){
box.textContent="Our stories are coming soon. Please check again.";
}
}
loadArticles();
</script>
</body>
</html>
